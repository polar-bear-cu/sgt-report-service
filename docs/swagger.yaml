definitions:
  dtos.CategoryTotalResponse:
    properties:
      category:
        type: string
      total:
        type: number
    type: object
  dtos.ChargeResponse:
    properties:
      amount:
        type: number
      category:
        type: string
      chargedAt:
        type: string
      name:
        type: string
      subscriptionId:
        type: string
      type:
        type: string
    type: object
  dtos.HealthResponse:
    properties:
      serviceName:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  dtos.MonthChargesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dtos.CategoryTotalResponse'
        type: array
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/dtos.ChargeResponse'
        type: array
      month:
        type: string
      total:
        type: number
    type: object
  dtos.MonthTotalResponse:
    properties:
      month:
        type: string
      total:
        type: number
    type: object
  dtos.MonthlySpendingResponse:
    properties:
      averagePerMonth:
        type: number
      months:
        items:
          $ref: '#/definitions/dtos.MonthTotalResponse'
        type: array
      total:
        type: number
    type: object
  dtos.SpendingBySubscriptionResponse:
    properties:
      from:
        type: string
      items:
        items:
          $ref: '#/definitions/dtos.SubscriptionSpendingResponse'
        type: array
      to:
        type: string
      total:
        type: number
    type: object
  dtos.SubscriptionSpendingResponse:
    properties:
      category:
        type: string
      count:
        type: integer
      name:
        type: string
      status:
        type: string
      subscriptionId:
        type: string
      total:
        type: number
      type:
        type: string
    type: object
info:
  contact: {}
  description: Subscription spending report for the Subglutee project
  title: Report Service API
  version: "1.0"
paths:
  /api/v1/reports/charges:
    get:
      parameters:
      - in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.MonthChargesResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 'charges of one month (default: current month) with the total of each
        category'
      tags:
      - reports
  /api/v1/reports/monthly:
    get:
      parameters:
      - in: query
        maximum: 24
        minimum: 1
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.MonthlySpendingResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: spending per month, the last item is the current month (still in progress)
      tags:
      - reports
  /api/v1/reports/subscriptions:
    get:
      parameters:
      - in: query
        name: from
        type: string
      - in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SpendingBySubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 'total spent per subscription in a month range (default: last 12 months),
        highest first'
      tags:
      - reports
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HealthResponse'
      summary: health check
      tags:
      - ops
swagger: "2.0"
